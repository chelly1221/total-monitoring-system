<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMS SoundSense</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" id="brand-dot"></span>
          <span>TMS SoundSense</span>
          <span class="ver" id="ver"></span>
        </div>
        <nav class="tabs">
          <button class="tab active" data-tab="status" type="button">상태</button>
          <button class="tab" data-tab="settings" type="button">설정</button>
        </nav>
      </header>

      <!-- 상태 화면 -->
      <section class="view active" id="view-status">
        <div class="indicator" id="indicator">
          <div class="indicator-label" id="indicator-label">무음</div>
          <div class="indicator-sub" id="indicator-peak">피크 0.000</div>
          <div class="meter"><div class="meter-fill" id="meter-fill"></div></div>
        </div>

        <div class="card">
          <div class="row">
            <span class="k">뮤트 상태</span>
            <span class="v" id="mute-state">-</span>
          </div>
          <div class="row">
            <span class="k">자동 해제까지</span>
            <span class="v mono" id="mute-remaining">-</span>
          </div>
          <div class="row actions">
            <select id="unmute-preset" class="small"></select>
            <button id="btn-unmute" type="button" class="secondary small">지금 해제</button>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <span class="k">서버 대상</span>
            <span class="v mono" id="target">-</span>
          </div>
          <div class="row">
            <span class="k">마지막 전송</span>
            <span class="v mono" id="last-sent">-</span>
          </div>
          <div class="row">
            <span class="k">전송 횟수</span>
            <span class="v mono" id="send-count">0</span>
          </div>
        </div>

        <div class="card">
          <div class="row"><span class="k">장비명</span><span class="v" id="st-name">-</span></div>
          <div class="row"><span class="k">PC 이름</span><span class="v mono" id="st-host">-</span></div>
          <div class="row"><span class="k">이 PC의 IP</span><span class="v mono" id="st-ip">-</span></div>
          <div class="row"><span class="k">클라이언트 ID</span><span class="v mono tiny" id="st-id">-</span></div>
          <div class="row"><span class="k">오디오</span><span class="v tiny" id="st-audio">-</span></div>
          <div class="row"><span class="k">탐지 응답</span><span class="v tiny" id="st-discovery">-</span></div>
        </div>
      </section>

      <!-- 설정 화면 -->
      <section class="view" id="view-settings">
        <form id="settings-form" autocomplete="off">
          <label class="field">
            <span>장비명</span>
            <input name="name" type="text" maxlength="60" placeholder="예: 1레이더 LCMS PC" required />
          </label>
          <div class="grid2">
            <label class="field">
              <span>감지 임계값 (0~1)</span>
              <input name="threshold" type="number" step="0.001" min="0.001" max="1" required />
            </label>
            <label class="field">
              <span>무음 판정 시간 (ms)</span>
              <input name="silenceMs" type="number" step="100" min="0" required />
            </label>
            <label class="field">
              <span>하트비트 주기 (ms)</span>
              <input name="intervalMs" type="number" step="100" min="200" required />
            </label>
            <label class="field">
              <span>자동 뮤트 해제 시간</span>
              <select name="unmuteMinutes" id="settings-unmute"></select>
            </label>
            <label class="field">
              <span>탐지 포트 (UDP)</span>
              <input name="discoveryPort" type="number" min="1" max="65535" required />
            </label>
            <label class="field">
              <span>인증 토큰</span>
              <input name="token" type="password" placeholder="서버와 동일하게 (선택)" />
            </label>
          </div>
          <label class="toggle">
            <input name="autostart" type="checkbox" />
            <span>Windows 시작 시 자동 실행</span>
          </label>

          <div class="card subtle">
            <div class="row">
              <span class="k">서버 전송 대상</span>
              <span class="v mono" id="settings-target">-</span>
            </div>
            <div class="hint" id="settings-target-hint">서버에서 자동탐지로 이 PC를 선택하면 자동 설정됩니다.</div>
            <details id="manual-target">
              <summary>수동 설정</summary>
              <div class="grid2">
                <label class="field">
                  <span>서버 IP</span>
                  <input name="targetIp" type="text" placeholder="192.168.0.10" />
                </label>
                <label class="field">
                  <span>포트</span>
                  <input name="targetPort" type="number" min="1" max="65535" placeholder="6100" />
                </label>
                <label class="field">
                  <span>소리 감지 시 전송 (on)</span>
                  <input name="on" type="text" maxlength="200" />
                </label>
                <label class="field">
                  <span>무음 시 전송 (off)</span>
                  <input name="off" type="text" maxlength="200" />
                </label>
              </div>
              <button type="button" id="btn-clear-target" class="link">대상 지우기</button>
            </details>
          </div>

          <div class="form-footer">
            <span class="msg" id="settings-msg"></span>
            <button type="submit" class="primary">저장</button>
          </div>
        </form>
      </section>
    </div>

    <!-- 장비명 등록 모달 (첫 실행) -->
    <div class="modal hidden" id="name-modal">
      <div class="modal-box">
        <h2>장비명을 등록해주세요</h2>
        <p>서버 자동탐지 목록에 표시될 이 PC의 이름입니다. 등록 후 변경할 수 있습니다.</p>
        <form id="name-form">
          <input id="name-input" type="text" maxlength="60" placeholder="예: 1레이더 LCMS PC" autofocus />
          <div class="modal-actions">
            <span class="msg" id="name-msg"></span>
            <button type="submit" class="primary">저장</button>
          </div>
        </form>
      </div>
    </div>

    <!-- identify 배너 -->
    <div class="identify hidden" id="identify-banner">
      <div class="identify-inner">
        <div class="identify-title">이 PC를 확인 중입니다</div>
        <div class="identify-name" id="identify-name"></div>
        <div class="identify-count" id="identify-count"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
