[package]
name = "tms-ping-monitor"
version = "1.0.2"
description = "네트워크 ping 감시 - TMS network monitoring client"
authors = ["chelly1221"]
edition = "2021"

[lib]
name = "tms_ping_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
log = "0.4"
env_logger = "0.11"
libloading = "0.8"
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Media_Audio", "Win32_System_Diagnostics_Debug",
  "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
